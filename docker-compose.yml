version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    environment:
      - USE_MOCK_BACKEND=true
      - LLM_BACKEND=none
      - PORT=8080

  ui:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      - DATAOPS_API_URL=http://api:8080
    depends_on:
      - api
